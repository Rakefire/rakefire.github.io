<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} | Ruby on Rails Web Application Development{% endif %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />
  <meta name="keywords" content="{{ site.keywords }}" />
  <meta name="author" content="{{ site.author }}" />

  <!-- Facebook and Twitter integration -->
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}" />
  <meta property="og:image" content="{{ site.url }}{{ site.logo }}" />
  <meta property="og:url" content="{{ site.url }}{{ page.url }}" />
  <meta property="og:site_name" content="{{ site.title }}" />
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}" />
  <meta name="twitter:image" content="{{ site.url }}{{ site.logo }}" />
  <meta name="twitter:url" content="{{ site.url }}{{ page.url }}" />
  <meta name="twitter:card" content="summary" />

  <!-- Place favicon.ico and apple-touch-icon.png in the root directory -->
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon-precomposed" href="apple-icon-precomposed.png" />

  <link
    href="//fonts.googleapis.com/css?family=Source+Sans+Pro:400,300,600,400italic,700"
    rel="stylesheet"
    type="text/css"
  />

  <!-- Animate.css -->
  <link rel="stylesheet" href="/css/animate.css" />
  <!-- Icomoon Icon Fonts-->
  <link rel="stylesheet" href="/css/icomoon.css" />
  <!-- Simple Line Icons -->
  <link rel="stylesheet" href="/css/simple-line-icons.css" />
  <!-- Magnific Popup -->
  <link rel="stylesheet" href="/css/magnific-popup.css" />

  <!-- Default Theme Style -->
  <link rel="stylesheet" href="/css/style.css" />

  <!-- Modernizr JS -->
  <script src="/js/modernizr-2.6.2.min.js"></script>
  <!-- FOR IE9 below -->
  <!--[if lt IE 9]>
    <script src="js/respond.min.js"></script>
  <![endif]-->

  <!-- Stoked -->
  <script
    src="https://rakefire.stokedhq.com/get-stoked.js"
    data-position="lower-left"
    data-button-en-text="Talk to a former client"
    data-button-es-text="Hablar con un cliente anterior"
    data-button-fr-text="Parler à un ancien client"
    defer
  ></script>
</head>
